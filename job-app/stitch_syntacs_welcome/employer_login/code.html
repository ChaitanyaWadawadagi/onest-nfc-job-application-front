<html><head>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<meta charset="utf-8"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-slate-50 justify-between group/design-root overflow-x-hidden" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<div class="flex flex-col flex-1 justify-center px-4">
<div class="flex flex-col items-center justify-center pb-8">
<h2 class="text-[#0d141b] text-2xl font-bold leading-tight tracking-[-0.015em]">SyntACS</h2>
</div>
<h1 class="text-slate-900 text-3xl font-bold leading-tight tracking-tighter text-center pb-4">Welcome Back, Employer</h1>
<p class="text-slate-600 text-base text-center pb-8">Login to your account to manage job postings and applications.</p>
<div class="flex flex-col gap-4">
<label class="flex flex-col gap-2">
<span class="text-slate-700 text-sm font-medium">Username</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"> person </span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-md text-slate-900 focus:outline-0 focus:ring-2 focus:ring-blue-500 border border-slate-300 bg-white h-12 placeholder:text-slate-400 pl-10 pr-4 text-base font-normal leading-normal" placeholder="Your username" value=""/>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-slate-700 text-sm font-medium">Password</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"> lock </span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-md text-slate-900 focus:outline-0 focus:ring-2 focus:ring-blue-500 border border-slate-300 bg-white h-12 placeholder:text-slate-400 pl-10 pr-4 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
</div>
</label>
</div>
<div class="flex justify-end pt-2 pb-6">
<a class="text-sm text-blue-600 hover:underline" href="#">Forgot password?</a>
</div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-12 px-4 w-full bg-blue-600 text-slate-50 text-base font-bold leading-normal tracking-[0.015em] hover:bg-blue-700 transition-colors">
<span class="truncate">Login</span>
</button>
<p class="text-slate-600 text-sm font-normal leading-normal py-4 text-center">
          Don't have an account?
          <a class="font-semibold text-blue-600 hover:underline" href="#">Register now</a>
</p>
</div>
<div class="sticky bottom-0">
<div class="flex gap-2 border-t border-slate-200 bg-white/80 backdrop-blur-sm px-4 pb-3 pt-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined text-2xl"> home </span>
<p class="text-xs font-medium">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined text-2xl"> work </span>
<p class="text-xs font-medium">Jobs</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-blue-600" href="#">
<span class="material-symbols-outlined text-2xl"> account_circle </span>
<p class="text-xs font-medium">Profile</p>
</a>
</div>
</div>
</div>

</body></html>
