<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700;900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>SyntACS</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
          --primary-color: #1173d4;
        }
        .animate-logo-up {
            animation: logo-up 1s ease-in-out forwards;
        }
        .animate-options-in {
            animation: options-in 1s ease-in-out forwards;
            opacity: 0;
        }
        @keyframes logo-up {
            from {
                transform: translateY(50%);
                opacity: 1;
            }
            to {
                transform: translateY(-50%);
                opacity: 1;
            }
        }
        @keyframes options-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50 font-manrope">
<div class="relative flex min-h-screen w-full flex-col justify-center items-center overflow-hidden">
<div class="absolute inset-0 flex flex-col justify-center items-center text-center p-4 animate-logo-up">
<div class="mb-4">
<svg class="h-24 w-24 mx-auto text-[var(--primary-color)]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15.536 8.464a5 5 0 010 7.072m-7.072-7.072a5 5 0 000 7.072m7.072 0l-2.122-2.122m-7.072-2.828l2.122-2.122" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<h1 class="text-[#0d141b] text-4xl font-bold tracking-tight">SyntACS</h1>
</div>
<div class="w-full max-w-sm p-4 animate-options-in" style="animation-delay: 1s;">
<div class="flex flex-col items-stretch gap-4">
<button class="flex items-center justify-center rounded-lg h-14 px-6 bg-[var(--primary-color)] text-white text-lg font-bold shadow-sm hover:bg-blue-700 transition-colors">
<span>Worker</span>
</button>
<button class="flex items-center justify-center rounded-lg h-14 px-6 bg-slate-200 text-[#0d141b] text-lg font-bold shadow-sm hover:bg-slate-300 transition-colors">
<span>Employer</span>
</button>
<button class="flex items-center justify-center rounded-lg h-14 px-6 bg-slate-200 text-[#0d141b] text-lg font-bold shadow-sm hover:bg-slate-300 transition-colors">
<span>Admin</span>
</button>
</div>
</div>
</div>

</body></html>
