<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>SyntACS - Employer Registration</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1173d4;
        --secondary-color: #e7edf3;
        --text-primary: #0d141b;
        --text-secondary: #4c739a;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<div class="relative flex h-auto min-h-screen w-full flex-col justify-between group/design-root overflow-x-hidden">
<div class="flex flex-col">
<header class="flex items-center bg-slate-50 p-4 justify-between sticky top-0 z-10">
<button class="text-[var(--text-primary)] flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-[var(--text-primary)] text-xl font-bold leading-tight tracking-tight flex-1 text-center pr-10">SyntACS</h2>
</header>
<main class="flex flex-col px-4 pt-6 pb-8">
<h1 class="text-[var(--text-primary)] text-2xl font-bold leading-tight tracking-tight mb-6">Employer Registration</h1>
<form class="space-y-6">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-slate-50 text-[var(--text-secondary)] text-xs font-medium" for="name">Name</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] border border-slate-300 bg-transparent h-14 placeholder:text-slate-400 p-4 text-base font-normal leading-normal" id="name" placeholder="Enter your full name" type="text" value=""/>
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-slate-50 text-[var(--text-secondary)] text-xs font-medium" for="age">Age</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] border border-slate-300 bg-transparent h-14 placeholder:text-slate-400 p-4 text-base font-normal leading-normal" id="age" placeholder="Enter your age" type="number" value=""/>
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-slate-50 text-[var(--text-secondary)] text-xs font-medium" for="pan">PAN</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] border border-slate-300 bg-transparent h-14 placeholder:text-slate-400 p-4 text-base font-normal leading-normal" id="pan" placeholder="Enter your PAN number" type="text" value=""/>
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-slate-50 text-[var(--text-secondary)] text-xs font-medium" for="aadhaar">Aadhaar Number</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] border border-slate-300 bg-transparent h-14 placeholder:text-slate-400 p-4 text-base font-normal leading-normal" id="aadhaar" placeholder="Enter your Aadhaar number" type="text" value=""/>
</div>
</form>
</main>
</div>
<footer class="sticky bottom-0 bg-slate-50 px-4 py-4 border-t border-slate-200">
<button class="flex w-full min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-4 bg-[var(--primary-color)] text-slate-50 text-base font-bold leading-normal tracking-wide shadow-lg shadow-blue-500/30 hover:bg-blue-600 transition-all duration-300">
<span class="truncate">Register</span>
</button>
</footer>
</div>

</body></html>
