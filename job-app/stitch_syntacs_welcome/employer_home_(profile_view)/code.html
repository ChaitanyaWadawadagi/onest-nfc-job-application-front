<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>SyntACS Employer Profile</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1173d4;
        --secondary-color: #f3f4f6;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
      }
      .form-input {
        @apply block w-full rounded-md border-gray-300 shadow-sm focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)] sm:text-sm;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[var(--secondary-color)]" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<div class="relative flex h-auto min-h-screen w-full flex-col justify-between overflow-x-hidden">
<main class="flex-grow">
<header class="bg-white shadow-sm sticky top-0 z-10">
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
<div class="flex h-16 items-center justify-between">
<button class="rounded-md bg-white p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)]" type="button">
<span class="sr-only">Open menu</span>
<span class="material-symbols-outlined"> menu </span>
</button>
<h1 class="text-xl font-bold text-[var(--text-primary)]">SyntACS</h1>
<div class="w-10"></div>
</div>
</div>
</header>
<div class="py-10">
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
<div class="flex flex-col items-center">
<div class="relative mb-4">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 ring-4 ring-white ring-offset-2 ring-offset-[var(--secondary-color)]" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBYNyUpgF-a9qCaGu720gkV_oKDoAe-fJG_Uq6MvTkS52_G43R6J5oeSwsvLcpXAr9T-Ue_ZgVonS3Na_ZHg4CB9U5elZAMBJ82-VrWvLdO8WD9k3FpMNXPrllL7esMEGoFlJMtNKxSky_zQ08Lm_tXZT3KME-f1YqqWJWOfHl-qGYzVo_6zSv1VOI7Hl3CR-jE7PZIBcAhwRWx7NeY34NYr8qUtohwaBklxMvik7XvRl74cJmWeXHfWvXQDWl44q0Q0CfQ_rLk8sGI");'></div>
<button class="absolute bottom-1 right-1 rounded-full bg-[var(--primary-color)] p-2 text-white shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--primary-color)]">
<span class="material-symbols-outlined !text-base"> edit </span>
</button>
</div>
<div class="text-center">
<p class="text-sm font-medium text-[var(--text-secondary)]">EMP-12345</p>
<p class="text-2xl font-bold text-[var(--text-primary)]">Ethan Carter</p>
</div>
</div>
<div class="mt-10">
<h3 class="text-lg font-bold leading-6 text-[var(--text-primary)] px-4 sm:px-0">Registration Details</h3>
<div class="mt-6 space-y-6 bg-white p-4 rounded-lg shadow-sm">
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)]" for="company-name">Company Name</label>
<div class="mt-1">
<input class="form-input" id="company-name" name="company-name" type="text" value="Innovate Inc."/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)]" for="company-address">Company Address</label>
<div class="mt-1">
<input class="form-input" id="company-address" name="company-address" type="text" value="123 Innovation Drive, Tech City"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)]" for="contact-number">Contact Number</label>
<div class="mt-1">
<input class="form-input" id="contact-number" name="contact-number" type="tel" value="+1 (555) 123-4567"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)]" for="email">Email Address</label>
<div class="mt-1">
<input class="form-input" id="email" name="email" type="email" value="ethan.carter@innovate.com"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)]" for="industry">Industry</label>
<div class="mt-1">
<input class="form-input" id="industry" name="industry" type="text" value="Technology"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-[var(--text-secondary)]" for="employee-count">Number of Employees</label>
<div class="mt-1">
<input class="form-input" id="employee-count" name="employee-count" type="number" value="500"/>
</div>
</div>
</div>
</div>
<div class="mt-8 flex justify-end">
<button class="rounded-md border border-gray-300 bg-white py-2 px-4 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2" type="button">Cancel</button>
<button class="ml-3 inline-flex justify-center rounded-md border border-transparent bg-[var(--primary-color)] py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2" type="submit">Save Changes</button>
</div>
</div>
</div>
</main>
<footer class="sticky bottom-0 z-10 border-t border-gray-200 bg-white">
<nav class="mx-auto flex max-w-7xl items-center justify-around px-4 py-2 sm:px-6 lg:px-8">
<a class="flex flex-col items-center gap-1 text-[var(--primary-color)]" href="#">
<span class="material-symbols-outlined"> work </span>
<span class="text-xs font-medium">Job Listing</span>
</a>
<a class="flex flex-col items-center gap-1 text-[var(--text-secondary)] hover:text-[var(--primary-color)]" href="#">
<span class="material-symbols-outlined"> history </span>
<span class="text-xs font-medium">History</span>
</a>
<a class="flex flex-col items-center gap-1 text-[var(--text-secondary)] hover:text-[var(--primary-color)]" href="#">
<span class="material-symbols-outlined"> nfc </span>
<span class="text-xs font-medium">NFC Scan</span>
</a>
<a class="flex flex-col items-center gap-1 text-[var(--text-secondary)] hover:text-[var(--primary-color)]" href="#">
<span class="material-symbols-outlined"> newspaper </span>
<span class="text-xs font-medium">News</span>
</a>
</nav>
</footer>
</div>

</body></html>
