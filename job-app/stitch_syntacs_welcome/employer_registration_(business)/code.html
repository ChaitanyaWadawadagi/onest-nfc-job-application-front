<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>SyntACS - Employer Registration</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #1173d4;
        --secondary-color: #e7edf3;
        --text-primary: #0d141b;
        --text-secondary: #4c739a;
      }
      .form-input {
        @apply w-full rounded-lg border-gray-300 bg-[var(--secondary-color)] p-4 text-base leading-normal text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)];
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50 font-manrope">
<div class="relative mx-auto flex h-auto min-h-screen w-full max-w-md flex-col justify-between">
<div class="flex-grow">
<header class="flex items-center p-4">
<button class="text-[var(--text-primary)]">
<span class="material-symbols-outlined"> arrow_back_ios_new </span>
</button>
<h2 class="flex-1 text-center text-lg font-bold text-[var(--text-primary)]">
            Register
          </h2>
<div class="w-8"></div>
</header>
<main class="px-4">
<h1 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">
            Business Registration
          </h1>
<p class="mt-2 text-[var(--text-secondary)]">
            Create an account to start hiring with SyntACS.
          </p>
<form class="mt-8 space-y-6">
<div class="relative">
<label class="sr-only" for="business-name">Business Name</label>
<span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]">
                business
              </span>
<input class="form-input pl-12" id="business-name" name="business-name" placeholder="Business Name" type="text"/>
</div>
<div class="relative">
<label class="sr-only" for="gstin-cin">GSTIN/CIN Number</label>
<span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]">
                badge
              </span>
<input class="form-input pl-12" id="gstin-cin" name="gstin-cin" placeholder="GSTIN/CIN Number" type="text"/>
</div>
<div class="relative">
<label class="sr-only" for="business-address">Business Address</label>
<span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]">
                location_on
              </span>
<input class="form-input pl-12" id="business-address" name="business-address" placeholder="Business Address" type="text"/>
</div>
<div class="relative">
<label class="sr-only" for="contact-number">Contact Number</label>
<span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]">
                phone
              </span>
<input class="form-input pl-12" id="contact-number" name="contact-number" placeholder="Contact Number" type="tel"/>
</div>
<div class="relative">
<label class="sr-only" for="email">Email Address</label>
<span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]">
                email
              </span>
<input class="form-input pl-12" id="email" name="email" placeholder="Email Address" type="email"/>
</div>
</form>
</main>
</div>
<footer class="p-4 pb-8">
<button class="flex w-full cursor-pointer items-center justify-center rounded-lg bg-[var(--primary-color)] px-5 py-4 text-base font-bold text-white shadow-lg shadow-blue-500/30 transition-transform duration-200 hover:scale-105 active:scale-100">
<span class="truncate">Register</span>
</button>
</footer>
</div>

</body></html>
